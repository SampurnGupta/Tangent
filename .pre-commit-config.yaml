repos:
  # Ruff: fast Python linter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(services|libs|scripts)/
      - id: ruff-format
        files: ^(services|libs|scripts)/

  # Secret scanning — detects accidentally committed keys
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: (\.env\.example|.*\.lock|uv\.lock|pnpm-lock\.yaml|legacy/.*|modules/.*|app\.py|seed_assets\.py)

  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.md$|^legacy/|^modules/|^app\.py|^seed_assets\.py)
      - id: end-of-file-fixer
        exclude: (^legacy/|^modules/|^app\.py|^seed_assets\.py)
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^(services|libs)/
        additional_dependencies: [pydantic>=2, fastapi]
