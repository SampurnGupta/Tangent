[project]
name = "tangent-root"
version = "0.1.0"
description = "Tangent monorepo root"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tangent-common",
    "tangent-contracts",
    "tangent-template-service",
    "tangent-market-data",
    "tangent-quant",
    "tangent-portfolio",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
tangent-common = { workspace = true }
tangent-contracts = { workspace = true }
tangent-template-service = { workspace = true }
tangent-market-data = { workspace = true }
tangent-quant = { workspace = true }
tangent-portfolio = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services", "tests"]
