name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.6.14"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Check code formatting with ruff
        run: uv run ruff format --check libs/ services/

      - name: Lint code with ruff
        run: uv run ruff check libs/ services/

      - name: Type check with mypy
        run: uv run mypy libs/ services/ --ignore-missing-imports

      - name: Run unit tests with pytest
        run: uv run pytest libs/ services/ -v

  docker-build-test:
    name: Build Template Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build template service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/template/Dockerfile
          push: false
          tags: tangent-template:test
