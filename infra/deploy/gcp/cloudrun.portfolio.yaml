apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tangent-portfolio
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/tangent-portfolio:latest
          ports:
            - containerPort: 8003
          resources:
            limits:
              memory: 256Mi
              cpu: 1000m
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tangent-secrets
                  key: database-url
