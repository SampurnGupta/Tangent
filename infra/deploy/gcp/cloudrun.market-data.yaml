apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tangent-market-data
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/PROJECT_ID/tangent-market-data:latest
          ports:
            - containerPort: 8001
          resources:
            limits:
              memory: 384Mi
              cpu: 1000m
          env:
            - name: APP_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tangent-secrets
                  key: database-url
            - name: UPSTASH_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: tangent-secrets
                  key: upstash-redis-url
