# fly.gateway.toml — Tangent Gateway deployment configuration on Fly.io
app = "tangent-gateway"
primary_region = "bom"

[build]
  dockerfile = "services/gateway/Dockerfile"

[env]
  PORT = "8000"
  DEMO_MODE = "false"
  SERVICE_NAME = "tangent-gateway"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
