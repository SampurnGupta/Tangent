[project]
name = "tangent-contracts"
version = "0.1.0"
description = "Pydantic contract schemas for Tangent microservices and frontend client generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
