[project]
name = "tangent-llm"
version = "0.1.0"
description = "Provider-agnostic LLM client abstraction for Tangent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tangent-common",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm"]
