[project]
name = "tangent-common"
version = "0.1.0"
description = "Shared logging, config, middleware, and HTTP client for Tangent services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "fastapi>=0.111.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
