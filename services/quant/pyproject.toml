[project]
name = "tangent-quant"
version = "0.1.0"
description = "Deterministic quantitative optimization and simulation engine for Tangent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tangent-common",
    "tangent-contracts",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]
