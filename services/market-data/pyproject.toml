[project]
name = "tangent-market-data"
version = "0.1.0"
description = "Market data service for Tangent (prices, FX, asset metadata, cache)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tangent-common",
    "tangent-contracts",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "yfinance>=0.2.38",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["market_data"]
