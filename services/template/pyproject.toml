[project]
name = "tangent-template-service"
version = "0.1.0"
description = "Template microservice for Tangent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tangent-common",
    "tangent-contracts",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
